<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191d"><link rel="manifest" href="manifest.json"><title>Garage Tracker</title><style>
:root{--bg:#101215;--card:#191d21;--text:#f2f4f5;--muted:#9aa4ad;--accent:#ff8a26;--line:#30373d;--green:#55c788}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:700px;margin:auto}header{padding:20px 4px 14px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.pill{background:#33251a;color:#ffad69;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.stat strong{display:block;font-size:22px}.stat small{color:var(--muted)}.toolbar{display:flex;gap:9px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:#1a1a1a;flex:1}.secondary{background:#20252a;color:var(--text);border:1px solid var(--line)}.job{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:15px}.jobhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.jobtitle{font-weight:750;font-size:18px}.jobmeta{color:var(--muted);font-size:13px;margin-top:3px}.task{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #282e33}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:var(--green)}.task.done span{text-decoration:line-through;color:var(--muted)}.progress{height:5px;background:#30363a;border-radius:9px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--green)}.note{width:100%;background:#131619;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:9px;font:inherit;resize:vertical}.menu{background:transparent;border:0;color:var(--muted);font-size:20px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.dialog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:600px;max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;border-radius:10px;background:#111416;border:1px solid var(--line);padding:12px;color:var(--text);font:inherit}.field textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.footer{text-align:center;color:#65717a;font-size:12px;padding:24px 0}
</style></head><body><header><div><h1>Garage Tracker</h1><div class="sub" id="date"></div></div><span class="pill">WORK LIST</span></header><div class="stats"><div class="stat"><strong id="activeCount">0</strong><small>Active jobs</small></div><div class="stat"><strong id="doneCount">0/0</strong><small>Tasks completed</small></div></div><div class="toolbar"><button class="btn primary" onclick="openAdd()">＋ Add job</button><button class="btn secondary" onclick="showCompleted()">History</button></div><div id="jobs"></div><div class="footer">Autosaves on this device</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add a job</h2><div class="field"><label>RO / Job number</label><input id="ro" placeholder="e.g. 920"></div><div class="field"><label>Vehicle</label><input id="vehicle" placeholder="e.g. Honda Civic"></div><div class="field"><label>Tasks (one per line)</label><textarea id="tasks" placeholder="Front brakes&#10;Alignment"></textarea></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveJob()">Save job</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let jobs=JSON.parse(localStorage.getItem('garageJobs')||'null');if(!jobs)jobs=[{id:'260815',vehicle:'Buick',tasks:[{text:'Replace radiator',done:false}],notes:'',archived:false},{id:'710',vehicle:'Range Rover',tasks:[{text:'Replace links',done:false},{text:'Replace bolt',done:false},{text:'Perform alignment',done:false}],notes:'',archived:false},{id:'782',vehicle:'Mercedes',tasks:[{text:'Left rear links',done:false},{text:'Rear control arms',done:false},{text:'Parking brake',done:false},{text:'Caliper',done:false}],notes:'',archived:false},{id:'793',vehicle:'',tasks:[{text:'Perform scan',done:false}],notes:'',archived:false},{id:'849',vehicle:'',tasks:[{text:'Perform scan',done:false}],notes:'',archived:false},{id:'820',vehicle:'',tasks:[{text:'Perform pre-scan',done:false}],notes:'',archived:false}];let editing=null,history=false;
function save(){localStorage.setItem('garageJobs',JSON.stringify(jobs));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let active=jobs.filter(j=>!j.archived),all=active.flatMap(j=>j.tasks),done=all.filter(t=>t.done).length;$('activeCount').textContent=active.length;$('doneCount').textContent=`${done}/${all.length}`;$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});let list=history?jobs.filter(j=>j.archived):active;$('jobs').innerHTML=list.length?list.map(j=>{let n=j.tasks.filter(t=>t.done).length,p=j.tasks.length?n/j.tasks.length*100:0;return `<section class="job"><div class="jobhead"><div><div class="jobtitle">#${esc(j.id)} ${esc(j.vehicle||'Vehicle not specified')}</div><div class="jobmeta">${n}/${j.tasks.length} tasks complete</div></div><button class="menu" onclick="editJob('${esc(j.id)}')">⋮</button></div><div class="progress"><div style="width:${p}%"></div></div>${j.tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${esc(j.id)}',${i},this.checked)"><span>${esc(t.text)}</span></label>`).join('')}<textarea class="note" placeholder="Notes..." onchange="updateNote('${esc(j.id)}',this.value)">${esc(j.notes||'')}</textarea><button class="btn secondary" style="width:100%;margin-top:10px" onclick="${history?`unarchive('${esc(j.id)}')`:`archive('${esc(j.id)}')`}">${history?'Restore job':'Mark job complete / move to history'}</button></section>`}).join(''):`<div class="empty">${history?'No completed jobs yet.':'All clear — add a job to get started.'}</div>`;$('toolbar')?.querySelector('button');document.querySelector('.toolbar button:nth-child(2)').textContent=history?'← Active jobs':'History'}
function toggleTask(id,i,v){let j=jobs.find(j=>j.id===id);if(j)j.tasks[i].done=v;save()}function updateNote(id,v){let j=jobs.find(j=>j.id===id);if(j){j.notes=v;localStorage.setItem('garageJobs',JSON.stringify(jobs))}}function archive(id){let j=jobs.find(j=>j.id===id);if(j)j.archived=true;save()}function unarchive(id){let j=jobs.find(j=>j.id===id);if(j)j.archived=false;save()}function showCompleted(){history=!history;render()}
function openAdd(){editing=null;$('modalTitle').textContent='Add a job';$('ro').value='';$('vehicle').value='';$('tasks').value='';$('notes').value='';$('modal').classList.add('show')}function editJob(id){let j=jobs.find(j=>j.id===id);if(!j)return;editing=id;$('modalTitle').textContent='Edit job';$('ro').value=j.id;$('vehicle').value=j.vehicle||'';$('tasks').value=j.tasks.map(t=>t.text).join('\n');$('notes').value=j.notes||'';$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function saveJob(){let id=$('ro').value.trim(),lines=$('tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!id){alert('Enter a job number');return}if(!lines.length){alert('Add at least one task');return}if(editing){let j=jobs.find(j=>j.id===editing);if(j){j.id=id;j.vehicle=$('vehicle').value.trim();j.tasks=lines.map(text=>({text,done:j.tasks.find(t=>t.text===text)?.done||false}));j.notes=$('notes').value}}else jobs.unshift({id,vehicle:$('vehicle').value.trim(),tasks:lines.map(text=>({text,done:false})),notes:$('notes').value,archived:false});closeModal();save()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
