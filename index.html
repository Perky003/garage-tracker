<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191d"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png"><title>Garage Tracker</title>
<style>
:root{--bg:#101215;--card:#191d21;--card2:#20252a;--text:#f2f4f5;--muted:#9aa4ad;--accent:#ff8a26;--line:#30373d;--green:#55c788}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:700px;margin:auto}header{padding:20px 4px 14px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.pill{background:#33251a;color:#ffad69;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.stat strong{display:block;font-size:22px}.stat small{color:var(--muted)}.toolbar{display:flex;gap:9px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:#1a1a1a;flex:1}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.job{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:15px}.jobhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.jobtitle{font-weight:750;font-size:18px}.jobmeta{color:var(--muted);font-size:13px;margin-top:3px}.menu{color:var(--muted);background:transparent;border:0;font-size:21px;padding:0 6px}.task{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #282e33}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0}.task.done span{text-decoration:line-through;color:var(--muted)}.progress{height:5px;background:#30363a;border-radius:9px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--green);width:0}.note{width:100%;background:#131619;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:9px;font:inherit;resize:vertical}.empty{text-align:center;color:var(--muted);padding:35px 10px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.dialog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:600px;max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;border-radius:10px;background:#111416;border:1px solid var(--line);padding:12px;color:var(--text);font:inherit}.field textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.footer{color:#65717a;text-align:center;font-size:12px;padding:24px 0}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab{background:var(--card2);color:var(--muted);border:1px solid var(--line);padding:11px 6px;border-radius:12px;font-weight:700}.tab.active{background:var(--accent);color:#181818;border-color:var(--accent)}.jobtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.urgent{display:inline-flex;background:#4b211c;color:#ff8371;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.4px}.schedule{display:inline-flex;background:#222c35;color:#b8d6f5;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:700}.field select{width:100%;border-radius:10px;background:#111416;border:1px solid var(--line);padding:12px;color:var(--text);font:inherit}.urgentfield{display:flex!important;align-items:center;gap:9px;color:var(--text)!important}.urgentfield input{width:20px;height:20px;accent-color:var(--accent)}.syncinfo{font-size:12px;color:var(--muted);padding:0 4px 10px;min-height:18px}.syncinfo.ok{color:var(--green)}.syncinfo.error{color:#ff9b82}.toolbar .btn{min-width:0}.syncbtn{white-space:nowrap}
</style></head><body>
<header><div><h1>Garage Tracker</h1><div class="sub" id="date"></div></div><span class="pill">WORK LIST</span></header>
<div class="stats"><div class="stat"><strong id="activeCount">0</strong><small>Active jobs</small></div><div class="stat"><strong id="doneCount">0/0</strong><small>Tasks completed</small></div></div>
<div class="tabs"><button class="tab active" data-view="today">Today</button><button class="tab" data-view="week">This week</button><button class="tab" data-view="next">Next week</button></div><div class="toolbar"><button class="btn primary" id="addBtn">＋ Add job</button><button class="btn secondary syncbtn" id="syncBtn" type="button">↻ Sync</button><button class="btn secondary" id="historyBtn">History</button></div><div class="syncinfo" id="syncInfo" role="status" aria-live="polite">ChatGPT inbox: not checked yet</div><div id="jobs"></div><div class="footer">Saved automatically on this device</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add a job</h2><div class="field"><label>RO / Job number</label><input id="ro" placeholder="e.g. 920"></div><div class="field"><label>Vehicle</label><input id="vehicle" placeholder="e.g. Honda Civic"></div><div class="field"><label>Tasks (one per line)</label><textarea id="tasks" placeholder="Front brakes&#10;Alignment"></textarea></div><div class="field"><label>Schedule for</label><input id="dueDate" type="date"></div><div class="field"><label class="urgentfield"><input id="urgent" type="checkbox"> Mark as URGENT</label></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div><div class="actions"><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save job</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let jobs=JSON.parse(localStorage.getItem('garageJobs')||'null');if(!jobs)jobs=[{id:'260815',vehicle:'Buick',tasks:[{text:'Replace radiator',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false},{id:'710',vehicle:'Range Rover',tasks:[{text:'Replace links',done:false},{text:'Replace bolt',done:false},{text:'Perform alignment',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false},{id:'782',vehicle:'Mercedes',tasks:[{text:'Left rear links',done:false},{text:'Rear control arms',done:false},{text:'Parking brake',done:false},{text:'Caliper',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false},{id:'793',vehicle:'',tasks:[{text:'Perform scan',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false},{id:'849',vehicle:'',tasks:[{text:'Perform scan',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false},{id:'820',vehicle:'',tasks:[{text:'Perform pre-scan',done:false}],notes:'',date:new Date().toISOString().slice(0,10),urgent:false,archived:false}];let editId=null,historyMode=false,currentView="today";
function persist(){localStorage.setItem('garageJobs',JSON.stringify(jobs));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateKey(d){return d.toISOString().slice(0,10)}function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function inView(j){let today=dateKey(new Date()),d=j.date||today;if(currentView==='today')return d===today;let start=weekStart(new Date());if(currentView==='next')start.setDate(start.getDate()+7);let end=new Date(start);end.setDate(end.getDate()+7);return d>=dateKey(start)&&d<dateKey(end)}
function render(){let active=jobs.filter(j=>!j.archived),all=active.flatMap(j=>j.tasks),checked=all.filter(t=>t.done).length; $('activeCount').textContent=active.length;$('doneCount').textContent=`${checked}/${all.length}`;$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});let list=historyMode?jobs.filter(j=>j.archived):active.filter(inView);
$('jobs').innerHTML=list.length?list.map(j=>{let c=j.tasks.filter(t=>t.done).length,p=j.tasks.length?c/j.tasks.length*100:0;return `<section class="job"><div class="jobhead"><div><div class="jobtop"><div class="jobtitle">#${esc(j.id)} ${esc(j.vehicle||'Vehicle not specified')}</div>${j.urgent?'<span class=\"urgent\">URGENT</span>':''}</div><div class="jobmeta"><span class=\"schedule\">${esc(j.date||dateKey(new Date()))}</span> · ${c} of ${j.tasks.length} tasks complete</div></div><button class="menu" data-edit="${esc(j.id)}" aria-label="Edit job">⋮</button></div><div class="progress"><div style="width:${p}%"></div></div>${j.tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-task="${esc(j.id)}" data-index="${i}" ${t.done?'checked':''}><span>${esc(t.text)}</span></label>`).join('')}<textarea class="note" data-note="${esc(j.id)}" placeholder="Notes...">${esc(j.notes||'')}</textarea>${historyMode?`<button class="btn secondary restore" data-id="${esc(j.id)}" style="width:100%;margin-top:10px">Restore job</button>`:`<button class="btn secondary archive" data-id="${esc(j.id)}" style="width:100%;margin-top:10px">Mark job complete / move to history</button>`}</section>`}).join(''):`<div class="empty">${historyMode?'No completed jobs yet.':'All clear — add a job to get started.'}</div>`;$('historyBtn').textContent=historyMode?'← Active jobs':'History';}
function openAdd(){editId=null;$('modalTitle').textContent='Add a job';$('ro').value='';$('vehicle').value='';$('tasks').value='';$('notes').value='';$('dueDate').value=dateKey(new Date());$('urgent').checked=false;$('modal').classList.add('show')}
function editJob(id){let j=jobs.find(x=>x.id===id);if(!j)return;editId=id;$('modalTitle').textContent='Edit job';$('ro').value=j.id;$('vehicle').value=j.vehicle||'';$('tasks').value=j.tasks.map(t=>t.text).join('\n');$('notes').value=j.notes||'';$('dueDate').value=j.date||dateKey(new Date());$('urgent').checked=!!j.urgent;$('modal').classList.add('show')}
function saveJob(){let id=$('ro').value.trim(),lines=$('tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!id){alert('Enter a job / RO number');return}if(!lines.length){alert('Add at least one task');return}if(editId){let j=jobs.find(x=>x.id===editId);if(j){j.id=id;j.vehicle=$('vehicle').value.trim();j.tasks=lines.map(text=>({text,done:j.tasks.some(t=>t.text===text&&t.done)}));j.notes=$('notes').value;j.date=$('dueDate').value||dateKey(new Date());j.urgent=$('urgent').checked}}else jobs.unshift({id,vehicle:$('vehicle').value.trim(),tasks:lines.map(text=>({text,done:false})),notes:$('notes').value,date:$('dueDate').value||dateKey(new Date()),urgent:$('urgent').checked,archived:false});$('modal').classList.remove('show');persist()}

// Read-only ChatGPT-to-Garage Tracker inbox. The phone's existing work never uploads to GitHub.
// Commands are deduplicated locally, so repeated checks do not create repeat jobs.
const INBOX_URL='./chatgpt-inbox.json';
const IMPORT_KEY='garageTrackerImportedChatGPTCommands';
let importedIds;
try { importedIds=new Set(JSON.parse(localStorage.getItem(IMPORT_KEY)||'[]')); }
catch (_) { importedIds=new Set(); }
let syncing=false;
function showSync(message,kind=''){const el=$('syncInfo');el.textContent=message;el.className='syncinfo '+kind;}
function addIncomingJob(command) {
  if (!command || typeof command!=='object' || command.action!=='add_job' || typeof command.id!=='string' || !command.id) return false;
  if(importedIds.has(command.id))return false;
  const item=command.job;
  if(!item || typeof item!=='object')return false;
  const ro=String(item.ro||'').trim().slice(0,80);
  const vehicle=String(item.vehicle||'').trim().slice(0,100);
  const tasks=(Array.isArray(item.tasks)?item.tasks:[]).map(t=>String(t).trim().slice(0,250)).filter(Boolean);
  const scheduled=typeof item.date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(item.date)?item.date:dateKey(new Date());
  if(!ro||!tasks.length)return false;
  const existing=jobs.find(j=>j.id===ro);
  if(existing) {
    // Preserve current job progress, notes, and schedule when updating an existing RO.
    const known=new Set(existing.tasks.map(t=>t.text.toLowerCase()));
    for(const task of tasks)if(!known.has(task.toLowerCase())){existing.tasks.push({text:task,done:false});known.add(task.toLowerCase())}
    if(!existing.vehicle&&vehicle)existing.vehicle=vehicle;
    if(item.urgent)existing.urgent=true;
  } else {
    jobs.unshift({id:ro,vehicle,tasks:tasks.map(text=>({text,done:false})),notes:'',date:scheduled,urgent:!!item.urgent,archived:false});
  }
  importedIds.add(command.id);
  return true;
}
async function syncChatGPT(silent=false){
  if(syncing)return;
  if(!navigator.onLine){if(!silent)showSync('Offline — ChatGPT jobs will sync when connected.','error');return}
  syncing=true;if(!silent)showSync('Checking for ChatGPT jobs…');
  try {
    const resp=await fetch(INBOX_URL+'?refresh='+Date.now(),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const inbox=await resp.json();
    if(!inbox||!Array.isArray(inbox.commands))throw new Error('Invalid inbox format');
    let count=0;
    for(const command of inbox.commands){if(addIncomingJob(command))count++}
    if(count){localStorage.setItem(IMPORT_KEY,JSON.stringify([...importedIds]));persist()}
    showSync(count?count+' new job'+(count===1?'':'s')+' synced from ChatGPT':'ChatGPT inbox checked — up to date','ok');
  }catch(error){
    if(!silent)showSync('Unable to sync right now. Try again when online.','error');
    console.warn('ChatGPT inbox sync failed',error);
  }finally{syncing=false;}
}
$('syncBtn').addEventListener('click',()=>syncChatGPT());
window.addEventListener('online',()=>syncChatGPT(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncChatGPT(true)});
setInterval(()=>{if(!document.hidden)syncChatGPT(true)},60000);
syncChatGPT(true);

document.querySelector('.tabs').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;currentView=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('addBtn').onclick=openAdd;$('cancelBtn').onclick=()=>$('modal').classList.remove('show');$('saveBtn').onclick=saveJob;$('historyBtn').onclick=()=>{historyMode=!historyMode;render()};$('jobs').addEventListener('change',e=>{let t=e.target;if(t.matches('[data-task]')){let j=jobs.find(x=>x.id===t.dataset.task);if(j)j.tasks[Number(t.dataset.index)].done=t.checked;persist()}else if(t.matches('[data-note]')){let j=jobs.find(x=>x.id===t.dataset.note);if(j){j.notes=t.value;localStorage.setItem('garageJobs',JSON.stringify(jobs))}}});$('jobs').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit)editJob(b.dataset.edit);if(b.classList.contains('archive')){let j=jobs.find(x=>x.id===b.dataset.id);if(j)j.archived=true;persist()}if(b.classList.contains('restore')){let j=jobs.find(x=>x.id===b.dataset.id);if(j)j.archived=false;persist()}});render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed', err));
  });
}
</script></body></html>
